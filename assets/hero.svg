<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" width="1400" height="420" role="img" aria-label="Robotics Skills Suite — 76 audit-ready Claude skills">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1628"/>
      <stop offset="1" stop-color="#1F3864"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB800"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <rect width="1400" height="420" fill="url(#bg)"/>
  <rect width="1400" height="420" fill="url(#grid)"/>

  <!-- Subtle glow behind text -->
  <ellipse cx="380" cy="210" rx="320" ry="140" fill="#FFB800" opacity="0.08" filter="url(#soft)"/>

  <!-- Geometric "fleet" of nodes — 6 connected circles (robots) on the right -->
  <g transform="translate(950, 90)" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" fill="none">
    <!-- Connections -->
    <line x1="100" y1="60"  x2="240" y2="60"/>
    <line x1="100" y1="60"  x2="170" y2="160"/>
    <line x1="240" y1="60"  x2="170" y2="160"/>
    <line x1="100" y1="60"  x2="40"  y2="160"/>
    <line x1="170" y1="160" x2="40"  y2="160"/>
    <line x1="170" y1="160" x2="240" y2="240"/>
    <line x1="40"  y1="160" x2="100" y2="240"/>
    <line x1="240" y1="240" x2="100" y2="240"/>

    <!-- Nodes -->
    <g fill="#1F3864" stroke="#FFB800" stroke-width="2.5">
      <circle cx="100" cy="60" r="20"/>
      <circle cx="240" cy="60" r="20"/>
      <circle cx="170" cy="160" r="22" fill="#FFB800" stroke="#FFB800"/>
      <circle cx="40"  cy="160" r="20"/>
      <circle cx="240" cy="240" r="20"/>
      <circle cx="100" cy="240" r="20"/>
    </g>
    <!-- Center "fleet manager" label dot -->
    <circle cx="170" cy="160" r="6" fill="#0A1628"/>
  </g>

  <!-- Title block -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" fill="#ffffff">
    <text x="80" y="138" font-size="22" font-weight="500" letter-spacing="6" fill="#FFB800" opacity="0.95">JHERRODTHOMAS</text>
    <text x="80" y="220" font-size="76" font-weight="800" letter-spacing="-2">Robotics Skills Suite</text>
    <text x="80" y="262" font-size="22" font-weight="400" opacity="0.78">Industrial robot, cobot, AMR, ROS2 — audit-ready lifecycle automation for Claude</text>
  </g>

  <!-- Stat row -->
  <g transform="translate(80, 310)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <g>
      <rect x="0" y="0" width="130" height="56" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)"/>
      <text x="65" y="28" text-anchor="middle" font-size="26" font-weight="800" fill="#FFB800">76</text>
      <text x="65" y="46" text-anchor="middle" font-size="11" font-weight="500" fill="#ffffff" opacity="0.7" letter-spacing="2">SKILLS</text>
    </g>
    <g transform="translate(150,0)">
      <rect x="0" y="0" width="130" height="56" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)"/>
      <text x="65" y="28" text-anchor="middle" font-size="26" font-weight="800" fill="#FFB800">38</text>
      <text x="65" y="46" text-anchor="middle" font-size="11" font-weight="500" fill="#ffffff" opacity="0.7" letter-spacing="2">PAIRS</text>
    </g>
    <g transform="translate(300,0)">
      <rect x="0" y="0" width="130" height="56" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)"/>
      <text x="65" y="28" text-anchor="middle" font-size="26" font-weight="800" fill="#FFB800">10</text>
      <text x="65" y="46" text-anchor="middle" font-size="11" font-weight="500" fill="#ffffff" opacity="0.7" letter-spacing="2">CLUSTERS</text>
    </g>
    <g transform="translate(450,0)">
      <rect x="0" y="0" width="320" height="56" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.18)"/>
      <text x="160" y="28" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ISO 10218 · 13849 · 62061 · 12100</text>
      <text x="160" y="46" text-anchor="middle" font-size="13" font-weight="500" fill="#ffffff" opacity="0.7">15066 · 9283 · 3691-4 · 62443 · ROS 2</text>
    </g>
  </g>
</svg>
